<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            background-color: #FFB300; 
            margin: 0; 
            padding: 0;
            overflow: hidden; /* Забранява скролването напълно */
            height: 100vh;
        }
        h1 { 
            color: white; 
            font-style: italic; 
            font-size: 18px; /* Още малко по-малко заглавие */
            margin: 5px 0; 
        }
        
        img { 
            width: 100%; 
            max-height: 160px; /* Намалена височина, за да изплуват бутоните нагоре */
            height: auto; 
            display: block;
            border: none;
            object-fit: contain; 
            margin-bottom: 5px;
        }

        .instruction { 
            color: #003399; 
            font-weight: bold; 
            margin: 5px 0; 
            font-size: 13px; 
        }
        
        .lang-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 6px; 
            padding: 0 10px;
        }
        
        button { 
            padding: 8px 2px; 
            font-size: 11px; 
            border: none; 
            border-radius: 6px; 
            background: #A9A9A9; 
            color: white; 
            font-weight: bold; 
            cursor: pointer;
            text-transform: uppercase;
        }
        
        button:active { background: #808080; }
    </style>
</head>
<body>
    <h1>Мобилно приложение</h1>
    <img src="http://localhost/burgas.jpg">
    <div class="instruction">Listen in your language:</div>
    <div class="lang-grid">
        <button onclick="window.AppInventor.setWebViewString('EN')">English</button>
        <button onclick="window.AppInventor.setWebViewString('DE')">Deutsch</button>
        <button onclick="window.AppInventor.setWebViewString('FR')">Français</button>
    </div>
</body>
</html>
