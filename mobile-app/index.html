
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            background-color: #FFB300; 
            margin: 0; 
            padding: 5px; 
            overflow-x: hidden;
        }
        h1 { color: white; font-style: italic; font-size: 20px; margin: 5px 0; }
        
        img { 
            width: 90%; 
            max-height: 250px; 
            height: auto; 
            border-radius: 12px; 
            border: 3px solid white; 
            object-fit: contain; 
        }

        .instruction { color: #003399; font-weight: bold; margin: 10px 0 5px 0; font-size: 14px; }
        
        /* Промяна: 3 колони за един ред */
        .lang-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 5px; 
            padding: 0 10px; 
        }
        
        button { 
            padding: 8px 2px; /* По-малки отстояния */
            font-size: 11px;    /* По-малък шрифт, за да се съберат */
            border: none; 
            border-radius: 6px; 
            background: #A9A9A9; 
            color: white; 
            font-weight: bold; 
            cursor: pointer;
            text-transform: uppercase;
        }
        
        button:active { 
            background: #808080; 
            transform: scale(0.95); 
        }
    </style>
</head>
<body>
    <h1>Бургаско приключение</h1>
    
    <img src="http://localhost/burgas.jpg">
    
    <div class="instruction">Listen in your language:</div>
    
    <div class="lang-grid">
        <button onclick="window.AppInventor.setWebViewString('EN')">English</button>
        <button onclick="window.AppInventor.setWebViewString('DE')">Deutsch</button>
        <button onclick="window.AppInventor.setWebViewString('FR')">Français</button>
    </div>
</body>
</html>
